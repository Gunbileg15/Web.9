<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title></title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 30px;
      }
      button {
        padding: 12px 25px;
        background: rgb(226, 10, 255);
        color: rgb(255, 255, 255);
        border: none;
        cursor: pointer;
        border-radius: 10px;
      }
      .box {
        width: 100px;
        height: 100px;
        background: rgb(255, 0, 0);
        margin: 10px;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        color: rgb(0, 0, 0);
        font-size: 25px;
        cursor: pointer;
        border-radius: 15px;
      }
    </style>
  </head>
  <body>
    <button id="addBtn">Add Box</button>
    <div id="container"></div>
    <script>
      const btn = document.getElementById("addBtn");
      const container = document.getElementById("container");
      let count = 0;
      btn.addEventListener("click", () => {
        count++;

        const box = document.createElement("div");

        box.classList.add("box");

        box.textContent = count;

        container.appendChild(box);
      });
    </script>
  </body>
</html>
